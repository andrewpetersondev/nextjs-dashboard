packages:
  - .

allowBuilds:
  cypress: true
  dprint: true
  esbuild: true
  sharp: true

overrides:
  # GHSA-g7r4-m6w7-qqqr (esbuild, patched 0.28.1): vite declares ^0.27.0 and drizzle-kit
  # ^0.25.4, both admitting vulnerable lines. Also dedupes tsx's ~0.28.0 to one copy.
  esbuild: ^0.28.1
  # Deliberate major-7 hold: vitest 4 accepts ^6||^7||^8 and would otherwise resolve
  # vite 8. Drop only as part of an intentional vite 8 migration.
  vite: ^7.3.5
  # next pins postcss 8.4.31 exact (patched, but old); dedupe the graph to one 8.5.x copy.
  # Still true as of next 16.2.12 — dropping this override forks the graph back into two copies.
  # ⚠ MUST equal the `postcss` devDependency range in package.json. Nothing bumps this when
  #   that one moves, so it silently falls behind (it sat a patch back from 2026-08-05 until
  #   2026-08-07). When a postcss bump lands in package.json, change it here in the same commit.
  postcss: ^8.5.26
  # GHSA-f88m-g3jw-g9cj (libvips CVEs inherited by sharp <0.35.0): next pins sharp ^0.34.5,
  # so this override forces the patched line until next bumps. Verified via production build.
  sharp: ^0.35.3
  # fast-uri, dev-only, reached through cypress webpack preprocessor → webpack →
  # schema-utils → ajv. Unlike esbuild/sharp above, ajv 8.20.0 already declares ^3.0.1 and
  # admits every fix — the lockfile was simply pinned to a version released before it. pnpm
  # only re-resolves DIRECT deps on `pnpm update`, so an override is the only lever on a
  # transitive. Stay on 3.x: ajv's ^3.0.1 excludes the 4.x line.
  # ⚠ RAISED 2026-09-03 to ^3.1.6, superseding the original GHSA-7p8r-x3mc-p8w7 (patched
  #   3.1.5) entry. Four further HIGH advisories landed against <3.1.6, all patched there:
  #   GHSA-f65p-4m7j-42xc (SSRF, malformed IPv6 normalization), GHSA-jqff-g426-hqxp (host
  #   confusion, percent-encoded scheme), GHSA-fph4-wmhf-6fwf (SSRF, repeated hostname
  #   percent-decoding), GHSA-5jgf-p345-68v8 (host confusion, skipped IDN canonicalization).
  #   Note ^3.1.5 ALREADY admitted 3.1.6 — the graph was on 3.1.5 only because the lockfile
  #   resolved before 3.1.6 shipped, so bumping this line is what forces re-resolution.
  #   Dependabot cannot raise this: an override-controlled transitive gets no bump PR, which
  #   is why all four alerts sat open with no branch attached.
  # Drop once the graph resolves >=3.1.6 on its own.
  fast-uri: ^3.1.6
  # GHSA-rgw5-rvv9-x895 (brace-expansion, patched 5.0.9): dev-only, reached through
  # rimraf → glob → minimatch. Same class as fast-uri above, NOT esbuild/sharp:
  # minimatch 10.2.6 declares ^5.0.8, which already admits the fix, so the blocker was a
  # lockfile pinned to 5.0.8 rather than an upstream pin below the patched line. Drop once
  # the graph resolves >=5.0.9 on its own; stay on 5.x.
  brace-expansion: ^5.0.9
  # GHSA-2v37-7h3g-55p8 (nanoid, patched 3.3.18): custom generators loop forever at size 0.
  # Same stale-lockfile class as fast-uri/brace-expansion — postcss 8.5.26 (latest) already
  # declares ^3.3.17, which admits the fix; the lockfile was just pinned to 3.3.17 (released
  # 4 days before it). Reached on the PROD path (next → postcss → nanoid) as well as the
  # cypress webpack chain, though nothing here imports nanoid, so the size-0 path is not
  # reachable from our code. Drop once the graph resolves >=3.3.18 on its own; stay on 3.x,
  # since postcss's ^3.3.17 excludes the 4.x/5.x lines.
  nanoid: ^3.3.18
  # GHSA-x5fp-wj9c-mxmx (array-limit bypass via bracket-key comma parsing, patched 6.15.4)
  # and GHSA-4mjr-xmp4-gh2g (DoS via attacker-controlled isBuffer, patched 6.16.0) — both
  # moderate, both dev-only, reached through cypress -> @cypress/request -> qs (and the same
  # chain under @testing-library/cypress / cypress-axe, which pull their own cypress).
  # Same stale-lockfile class as fast-uri/brace-expansion/nanoid above, NOT esbuild/sharp:
  # @cypress/request 4.0.1 already declares ^6.15.2, which admits both fixes — the graph sat
  # on 6.15.3 only because the lockfile resolved before 6.16.0 shipped. pnpm only re-resolves
  # DIRECT deps on `pnpm update`, so an override is the only lever, and Dependabot opens no
  # bump PR for a transitive. Cypress 16 would also pull it in; that major is not needed for
  # this. Stay on 6.x. Drop once the graph resolves >=6.16.0 on its own.
  qs: ^6.16.0
  # Deliberate hold at 16.2.12: `output: "standalone"` (next.config.ts, for the Docker path)
  # plus Vercel's build adapter fails EVERY deploy on 16.3.x —
  # `ENOENT … .next/next-server.js.nft.json` thrown from `onBuildComplete`. Next PR #93684
  # stopped emitting that file when an adapter is active, but the standalone finalizer's
  # `copyTracedFiles` still reads it unguarded; Vercel injects its adapter via
  # NEXT_ADAPTER_PATH, so both sides are on.
  # ⚠ Re-verified 2026-08-24 against next 16.3.2 (latest stable, released 2026-08-21) — the
  #   hold STILL STANDS. Upstream vercel/next.js#96646 is CLOSED and both 16.3.1 (2026-08-13)
  #   and 16.3.2 (2026-08-21) are stable, but neither contains the actual fix,
  #   vercel/next.js#97287 (merge commit c7b87c23), which landed on CANARY only
  #   (2026-08-14, ~10h after 16.3.1 shipped) and is what auto-closed the issue.
  #   Checked directly, not inferred from dates: `gh api
  #   repos/vercel/next.js/compare/c7b87c23...v16.3.2 -q .status` → "diverged" (fix commit is
  #   NOT an ancestor of the 16.3.2 tag); same result for v16.3.1.
  # ⚠ This repo's own gates CANNOT catch it: a plain `next build` runs no adapter, so the
  #   `csp` job went green on the exact commit Vercel refused. On any next bump, the Vercel
  #   check is the only signal — and even that is blind unless BOTH this override and the
  #   package.json pin move together (see next bullet), since the override otherwise pins
  #   the whole graph including the direct dependency and the new version is never installed.
  # ⚠ EXACT, not a caret — `^16.2.12` admits 16.3.0, so a caret holds nothing.
  # ⚠ MUST equal the `next` dependency range in package.json; `pnpm deps:drift` gates it.
  # RETIRE: only when a STABLE release CONTAINS commit c7b87c23 — never merely because a
  #   release post-dates the issue closing. Directly checkable:
  #   `gh api repos/vercel/next.js/compare/c7b87c23...v<tag> -q .status` must read "ahead" or
  #   "identical", never "diverged". Then lift this override, the package.json pin, and the
  #   `next: ["16.3.x"]` ignore in .github/dependabot.yml (which would otherwise also block
  #   the fixed version) in ONE edit, and let the Vercel check on that branch be the proof.
  next: 16.2.12

# Vetted peer combos that upstream ranges haven't caught up to (both at latest release):
# - @cypress/webpack-batteries-included-preprocessor 5.0.0 declares peer ^6.0.4, but the e2e
#   suite runs green against @cypress/webpack-preprocessor 7.x. Re-checked on the 4.2.0 -> 5.0.0
#   major (2026-09-03), which is what the re-check note below asks for: upstream did NOT widen —
#   5.0.0 still declares ^6.0.4, so this entry stays. The major's ONLY breaking change is
#   CoffeeScript removal (coffee-loader + coffeescript dropped, the /\.coffee$/ rule and the
#   .coffee resolve extension deleted); this repo has no .coffee files, and the `typescript`
#   option cypress.config.ts passes is byte-identical between 4.2.0 and 5.0.0. Verified by
#   running the full 23-spec e2e suite against 5.0.0 before the bump landed — CI cannot do this,
#   since the e2e job skips on pull_request (see .github/workflows/ci.yml).
# - tsconfck 3.1.6 (via vite-tsconfig-paths) declares peer typescript ^5, works with TS 7.
# - @napi-rs/wasm-runtime 1.2.x (optional wasm32-wasi fallback under knip's oxc bindings)
#   declares peer @emnapi/core+runtime ^2.0.0-alpha.3, but only stable 1.x is published;
#   knip runs on the native bindings, so the wasm fallback peers are inert here.
# Re-check on major bumps of cypress preprocessors / typescript; drop entries once upstream widens.
peerDependencyRules:
  allowedVersions:
    "@cypress/webpack-batteries-included-preprocessor>@cypress/webpack-preprocessor": "7"
    "@napi-rs/wasm-runtime>@emnapi/core": "1"
    "@napi-rs/wasm-runtime>@emnapi/runtime": "1"
    "tsconfck>typescript": "7"
