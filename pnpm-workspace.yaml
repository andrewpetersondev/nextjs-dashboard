packages:
  - .

allowBuilds:
  cypress: true
  dprint: true
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - cypress
  - dprint
  - esbuild
  - sharp

overrides:
  esbuild: ^0.28.1
  vite: ^7.3.5
  postcss: ^8.5.23
  # GHSA-3jxr-9vmj-r5cp (brace-expansion DoS): dev-only transitive via
  # rimraf -> glob -> minimatch, which pulled 5.0.6. Re-patched in 5.0.8 (the 5.0.7
  # fix was incomplete — the advisory range now covers <=5.0.7).
  brace-expansion: ^5.0.8
  # GHSA-f88m-g3jw-g9cj (libvips CVEs inherited by sharp <0.35.0): next pins sharp ^0.34.5,
  # so this override forces the patched line until next bumps. Verified via production build.
  sharp: ^0.35.3

# Vetted peer combos that upstream ranges haven't caught up to (both at latest release):
# - @cypress/webpack-batteries-included-preprocessor 4.2.0 declares peer ^6.0.4, but the e2e
#   suite runs green against @cypress/webpack-preprocessor 7.x.
# - tsconfck 3.1.6 (via vite-tsconfig-paths) declares peer typescript ^5, works with TS 7.
# Re-check on major bumps of cypress preprocessors / typescript; drop entries once upstream widens.
peerDependencyRules:
  allowedVersions:
    "@cypress/webpack-batteries-included-preprocessor>@cypress/webpack-preprocessor": "7"
    "tsconfck>typescript": "7"

sideEffectsCache: false
