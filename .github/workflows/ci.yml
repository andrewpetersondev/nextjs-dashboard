# Continuous Integration (CI)
#
# Single-branch, local-first model: feature work is merged into `main` locally
# (worktrees share one object store, so no remote round-trip) and pushed. Human
# feature work opens no PRs — CI runs on every push to `main` as the safety net.
# (Renovate still opens PRs; `dependency-review.yml` is the gate for those.)
#
#   • check — fast, dependency-free checks (Biome lint + Markdown lint/format +
#     Next.js typegen + type-check) plus the migration-drift gate and the DB-free
#     unit lane with coverage thresholds (~1 min).
#   • e2e — the slow Cypress end-to-end suite against a real `next dev` server
#     backed by an ephemeral Postgres service container (recreates the
#     `.env.test.local` from non-secret CI values, so no GitHub secrets needed).
#   • csp — production build + `csp:guard`, the ONLY check that can see the
#     enforced Content-Security-Policy. It needs a real `next build`, which the
#     `check` job deliberately does not run, hence its own job. Cypress cannot
#     substitute: it strips the CSP header by default and runs against
#     `next dev`, which never prerenders.
#
#   • integration — the Vitest integration lane against a real Postgres
#      service container. Needs a database but no browser and no server, so it
#      is its own job rather than a step in `e2e`: it finishes in about a minute
#      instead of waiting on the full Cypress suite.
#
# All four run on every push to `main`. Because the merge happens locally before
# the push, a red run means fix-forward — run `pnpm check:fast` locally before
# merging to catch most failures pre-push. Note that `check:fast` does NOT cover
# the integration lane (no database), so this job is its only automatic gate.

name: CI

# When should this workflow run?
on:
  push:
    branches: [main]

# If you push again before a run finishes, cancel the old run (saves CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  check:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your repository code onto the runner.
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Install pnpm. The version is read automatically from the
      #    "packageManager" field in package.json, so it stays in sync.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # 3. Install Node.js and cache the pnpm store so installs are faster.
      #    (pnpm must be set up BEFORE this step for the cache to work.)
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc" # single source of truth for the Node version
          cache: pnpm

      # 4. Install dependencies exactly as pinned in pnpm-lock.yaml.
      #    --frozen-lockfile fails the build if the lockfile is out of date.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Lint, formatting, and import-order checks (Biome).
      - name: Lint
        run: pnpm biome:lint

      # 6. Markdown lint (markdownlint-cli2) + format check (dprint).
      - name: Markdown
        run: pnpm md:check

      # 7. Generate Next.js route types (consumed by the type-check below).
      - name: Next.js typegen
        run: pnpm next:typegen

      # 8. TypeScript type-checking, against fresh typegen output. Two projects:
      #    the app (`tsc -b`) and the Cypress sources, which sit outside that
      #    build graph and need their own baseUrl-free tsconfig variant to pass
      #    under TS7 (see cypress/tsconfig.typecheck.json).
      - name: Type-check
        run: pnpm typecheck

      # 9. Migration drift gate: assert the dev/test/prod drizzle migration sets
      #    describe the same final schema. Pure file comparison (no database),
      #    so it runs in plain CI. Catches the per-env drift that broke prod on
      #    2026-06-11. See BACKLOG "Per-env migration drift guard".
      - name: Migration drift
        run: pnpm db:drift

      # 10. Dead-code gate. Knip is static and env-free (no database, no .env),
      #     so it runs in plain CI, and at ~1s it is the cheapest step here.
      #     Added 2026-08-06: it previously ran only via `pnpm check:repo`, which
      #     nothing executed, so it drifted red unnoticed — the same
      #     "wired into no pipeline" flaw that killed an earlier typecheck script.
      #     Exit 1 means findings, not a crash; triage per docs/knip.md.
      - name: Dead code
        run: pnpm knip

      # 11. Unit tests + coverage. The unit lane is DB-free (dummy env + mocked
      #     DB), so it runs in plain CI. `test:coverage` also enforces the
      #     coverage floors in `vitest.config.ts` — a regression below them fails
      #     the build.
      - name: Unit tests + coverage
        run: pnpm test:coverage

  csp:
    name: CSP guard
    # A prerendered page cannot carry a per-request nonce, so it ships un-nonced
    # and never hydrates — while still LOOKING correct in a screenshot. Nothing
    # else in this pipeline can catch that: `check` runs no build, and Cypress
    # strips the CSP header. This job builds for production and asserts against
    # the served responses.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `next build` validates the server env at module scope while collecting
      # page data, so it fails outright without these — but it never dials the
      # database, so dummy values are enough (no service container, no secrets).
      # Do NOT set NODE_ENV: `next build` owns it, and forcing `development`
      # here would build a dev bundle and serve the relaxed dev policy.
      - name: Build and assert the served CSP
        run: pnpm csp:guard:build
        env:
          AUTH_BCRYPT_SALT_ROUNDS: "12"
          DATABASE_ENV: production
          DATABASE_URL: postgresql://u:p@127.0.0.1:5999/nope
          PORT: "3000"
          SESSION_SECRET: ci-dummy-session-secret-at-least-32-chars
          NEXT_PUBLIC_LOG_LEVEL: info
          NEXT_PUBLIC_NODE_ENV: production

  integration:
    name: Integration (Vitest)
    # The `check` job runs only the DB-free unit lane, so until this existed the
    # integration lane ran on developer machines and nowhere else — a break in
    # it reached `main` unnoticed unless the e2e suite happened to catch the
    # same path downstream.
    #
    # Deliberately a SEPARATE job from `e2e` rather than a step inside it: these
    # tests need a database but no browser and no server, so they finish in
    # about a minute and give a much faster signal than waiting on Cypress.
    #
    # ⚠️ Added as a NEW job, never by renaming one. Required-status-check
    # contexts are pinned to job NAMES, so a rename silently blocks merges.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Same ephemeral database as the e2e job, pinned to the same image so the
    # two DB lanes cannot drift onto different Postgres majors. `postgres:latest`
    # (18+) breaks the documented volume mount — see docs/database-setup.md.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      # `allowBuilds: cypress` in pnpm-workspace.yaml lets Cypress's postinstall
      # run, which downloads its browser binary. This lane never opens a browser,
      # and unlike the e2e job there is no binary cache here, so skip the
      # download outright rather than pay for it on every run.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: "0"

      # `pnpm test:integration` runs through `env:test`, which loads
      # `.env.test.local` — so the file has to exist even though no server boots.
      # Kept byte-identical to the e2e job's so the two DB lanes cannot drift
      # into different environments; PORT is unused here and present for parity.
      - name: Write .env.test.local
        run: |
          {
            echo "AUTH_BCRYPT_SALT_ROUNDS=12"
            echo "DATABASE_ENV=test"
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db"
            echo "NODE_ENV=test"
            echo "PORT=3000"
            echo "SESSION_SECRET=$(openssl rand -base64 48)"
            echo "NEXT_PUBLIC_LOG_LEVEL=info"
            echo "NEXT_PUBLIC_NODE_ENV=test"
          } > .env.test.local

      - name: Apply test migrations
        run: pnpm db:migrate:test

      # No seed step, unlike the e2e job. These tests create the rows they need
      # and delete them again by email/id; none reference a seeded demo account,
      # and none touch customers or invoices. Seeding would only add a slower
      # step and a second thing that can fail.
      - name: Run integration tests
        run: pnpm test:integration

  e2e:
    name: E2E (Cypress)
    # Runs on every push to `main` (the only trigger now). The local pre-push
    # `pnpm check:fast` covers lint/types/typegen/drift but runs NO tests at
    # all; this is the full e2e safety net.
    runs-on: ubuntu-latest
    # Generous ceiling: a cold `next dev` (Turbopack compiles routes on first
    # hit) plus 23 specs. The warm local run is ~35s; this is a safety net.
    timeout-minutes: 15

    # Ephemeral test database. POSTGRES_DB MUST be `test_db`: the `db-env-guard`
    # smoke spec asserts databaseName==="test_db", and the e2e preflight asserts
    # databaseEnv==="test" — both read from /api/health.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      # Cache the Cypress binary (~/.cache/Cypress). Restored BEFORE install so
      # the `cypress` postinstall finds it instead of re-downloading every run.
      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The e2e harness (cypress-with-server.cli.ts) treats .env.test.local as
      # the single source of truth for PORT + the DB env. Recreate it from
      # non-secret CI values; SESSION_SECRET is generated per run (specs never
      # assert on it, only that it is present and valid).
      - name: Write .env.test.local
        run: |
          {
            echo "AUTH_BCRYPT_SALT_ROUNDS=12"
            echo "DATABASE_ENV=test"
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db"
            echo "NODE_ENV=test"
            echo "PORT=3000"
            echo "SESSION_SECRET=$(openssl rand -base64 48)"
            echo "NEXT_PUBLIC_LOG_LEVEL=info"
            echo "NEXT_PUBLIC_NODE_ENV=test"
          } > .env.test.local

      # Apply the committed TEST migrations (drizzle-kit migrate, scope=test):
      # the production-like path that also exercises the drift-guarded set.
      - name: Apply test migrations
        run: pnpm db:migrate:test

      # Seed the demo users/invoices the specs expect.
      - name: Seed test database
        run: pnpm db:seed:test

      # Boots `next dev` (test env) on PORT, waits for it, runs the /api/health
      # identity preflight, then the Cypress suite. start-server-and-test tears
      # the server down afterward and propagates the suite's exit code.
      - name: Run Cypress e2e
        run: pnpm cy:e2e

      # Failure screenshots are the only visual debugging artifact (video is
      # off); without this upload they die with the runner and every red e2e
      # run is debuggable from logs alone.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore
